services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: ["serve"]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["ollama"]
    command: ["pull", "phi3"]
    restart: "no"

  app:
    build: .
    image: ollama-chat-app
    container_name: ollama-chat
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: phi3
    stdin_open: true
    tty: true

volumes:
  ollama-data:
